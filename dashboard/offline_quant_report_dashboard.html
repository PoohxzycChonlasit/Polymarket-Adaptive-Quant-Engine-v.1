<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline Quant Report Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #d9dee8;
      --ink: #18202f;
      --muted: #687386;
      --blue: #2563eb;
      --teal: #0f766e;
      --amber: #b45309;
      --red: #b91c1c;
      --green: #15803d;
      --slate: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      border-bottom: 1px solid var(--line);
      background: #fff;
      padding: 18px 24px;
    }
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 24px 32px;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; line-height: 1.2; letter-spacing: 0; }
    h2 { font-size: 15px; margin-bottom: 10px; }
    h3 { font-size: 13px; color: var(--muted); font-weight: 650; margin-bottom: 8px; }
    .topbar {
      max-width: 1480px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
    }
    .subtitle { color: var(--muted); margin-top: 4px; }
    .guardrail {
      border: 1px solid #b9c7d9;
      background: #eef4fb;
      color: #24415f;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      max-width: 520px;
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(260px, 1.5fr) repeat(2, minmax(150px, 0.7fr));
      gap: 10px;
      margin: 16px 0;
      align-items: end;
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    select, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      color: var(--ink);
      background: #fff;
      font: inherit;
    }
    .grid {
      display: grid;
      gap: 12px;
    }
    .metrics {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
    .columns {
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      margin-top: 12px;
    }
    .wide-columns {
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      margin-top: 12px;
    }
    .panel, .metric {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 7px;
      padding: 14px;
      box-shadow: 0 1px 2px rgb(16 24 40 / 4%);
      min-width: 0;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric .value {
      margin-top: 6px;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 760;
      overflow-wrap: anywhere;
    }
    .metric .note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 720;
      background: #fff;
    }
    .ok { color: var(--green); border-color: #9ad0a7; background: #eefbf1; }
    .warn { color: var(--amber); border-color: #f0ca8c; background: #fff7e8; }
    .bad { color: var(--red); border-color: #efaaa8; background: #fff1f1; }
    .info { color: var(--blue); border-color: #b7c8fb; background: #eef4ff; }
    .bars { display: grid; gap: 9px; }
    .bar-row {
      display: grid;
      grid-template-columns: 190px 1fr 56px;
      gap: 10px;
      align-items: center;
    }
    .bar-label {
      color: var(--slate);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .track {
      height: 9px;
      background: #edf1f7;
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--blue));
      border-radius: 999px;
    }
    .count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
      font-size: 12px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .timeline-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: #fbfcfe;
      min-width: 0;
    }
    dl {
      display: grid;
      grid-template-columns: minmax(110px, 0.9fr) minmax(0, 1.1fr);
      gap: 6px 10px;
      margin: 0;
    }
    dt { color: var(--muted); font-size: 12px; }
    dd { margin: 0; font-size: 12px; overflow-wrap: anywhere; }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 8px 6px;
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }
    .small { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); padding: 20px; text-align: center; }
    @media (max-width: 1100px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .columns, .wide-columns, .cards { grid-template-columns: 1fr; }
      .topbar { align-items: stretch; flex-direction: column; }
    }
    @media (max-width: 720px) {
      header, main { padding-left: 14px; padding-right: 14px; }
      .filters { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: minmax(90px, 0.8fr) 1fr 46px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>Offline Quant Report Dashboard</h1>
        <p class="subtitle">Completed JSON reports from runtime/reports only.</p>
      </div>
      <div id="guardrail" class="guardrail">Loading read-only report summaries...</div>
    </div>
  </header>
  <main>
    <section class="filters" aria-label="Report filters">
      <label>Run ID
        <select id="runFilter"></select>
      </label>
      <label>Date
        <select id="dateFilter"></select>
      </label>
      <label>Search
        <input id="searchFilter" placeholder="root cause, status, report file">
      </label>
    </section>

    <section class="grid metrics" id="metrics"></section>

    <section class="grid columns">
      <div class="panel">
        <h2>Lifecycle Distribution</h2>
        <div id="lifecycleBars" class="bars"></div>
      </div>
      <div class="panel">
        <h2>EV / Probability Visibility</h2>
        <div id="evPanel"></div>
      </div>
    </section>

    <section class="grid wide-columns">
      <div class="panel">
        <h2>Liquidity / Orderbook Readiness</h2>
        <div id="liquidityPanel"></div>
      </div>
      <div class="panel">
        <h2>Timeline / Replay Summary</h2>
        <div id="timelineCards" class="cards"></div>
      </div>
    </section>

    <section class="panel" style="margin-top: 12px;">
      <h2>Report Records</h2>
      <div id="recordsTable"></div>
    </section>
  </main>

  <script>
    const state = { records: [], selected: null, payload: null };
    const fmt = new Intl.NumberFormat("en-US");

    function statusClass(value) {
      const text = String(value || "").toUpperCase();
      if (["PASS", "READY", "HEALTHY"].some((token) => text.includes(token))) return "ok";
      if (["FAIL", "ERROR", "BAD"].some((token) => text.includes(token))) return "bad";
      if (["WARN", "ATTENTION", "UNKNOWN"].some((token) => text.includes(token))) return "warn";
      return "info";
    }

    function countValue(value) {
      return typeof value === "number" ? fmt.format(value) : String(value ?? "0");
    }

    function makeMetric(label, value, note, cls) {
      return `<div class="metric">
        <div class="label">${label}</div>
        <div class="value"><span class="pill ${cls || statusClass(value)}">${value}</span></div>
        <div class="note">${note || ""}</div>
      </div>`;
    }

    function barRows(data) {
      const rows = Object.entries(data || {}).sort((a, b) => b[1] - a[1]);
      if (!rows.length) return '<div class="empty">No lifecycle distribution in selected reports.</div>';
      const max = Math.max(...rows.map(([, value]) => Number(value) || 0), 1);
      return rows.map(([key, value]) => {
        const width = Math.max(2, Math.round(((Number(value) || 0) / max) * 100));
        return `<div class="bar-row">
          <div class="bar-label" title="${key}">${key}</div>
          <div class="track"><div class="fill" style="width: ${width}%"></div></div>
          <div class="count">${countValue(value)}</div>
        </div>`;
      }).join("");
    }

    function detailList(items) {
      return `<dl>${Object.entries(items || {}).map(([key, value]) => (
        `<dt>${key.replaceAll("_", " ")}</dt><dd>${Array.isArray(value) ? value.join(", ") : String(value ?? "")}</dd>`
      )).join("")}</dl>`;
    }

    function filteredRecords() {
      const run = document.getElementById("runFilter").value;
      const date = document.getElementById("dateFilter").value;
      const search = document.getElementById("searchFilter").value.trim().toLowerCase();
      return state.records.filter((record) => {
        const runOk = run === "all" || record.run_id === run;
        const dateOk = date === "all" || record.date === date;
        const blob = JSON.stringify({
          run_id: record.run_id,
          date: record.date,
          root: record.root_cause,
          continuity: record.continuity,
          files: record.source_files
        }).toLowerCase();
        return runOk && dateOk && (!search || blob.includes(search));
      });
    }

    function selectDefault(records) {
      if (!records.length) return null;
      const latestId = state.payload.latest_run_id;
      return records.find((record) => record.run_id === latestId) || records[0];
    }

    function renderFilters() {
      const runs = [...new Set(state.records.map((record) => record.run_id))];
      const dates = [...new Set(state.records.map((record) => record.date))];
      document.getElementById("runFilter").innerHTML = '<option value="all">All runs</option>' + runs.map((run) => `<option>${run}</option>`).join("");
      document.getElementById("dateFilter").innerHTML = '<option value="all">All dates</option>' + dates.map((date) => `<option>${date}</option>`).join("");
      if (state.payload.latest_run_id) document.getElementById("runFilter").value = state.payload.latest_run_id;
    }

    function renderSelected(record) {
      if (!record) {
        document.getElementById("metrics").innerHTML = '<div class="empty">No report records found.</div>';
        return;
      }
      const continuity = record.continuity || {};
      const root = record.root_cause || {};
      const badJson = record.bad_json || {};
      const liquidity = record.liquidity_orderbook || {};
      const ev = record.ev_visibility || {};
      document.getElementById("metrics").innerHTML = [
        makeMetric("Latest run_id", record.run_id, record.sort_timestamp_utc || "", "info"),
        makeMetric("Continuity", continuity.status || "UNKNOWN", `timestamp ${continuity.timestamp_ordering || "UNKNOWN"}`),
        makeMetric("Root cause", root.primary || "UNKNOWN", `secondary ${root.secondary || "UNKNOWN"}`, "info"),
        makeMetric("time_unsafe", countValue(record.time_unsafe_count), "blocked before entry", "warn"),
        makeMetric("risk_plan_zero", countValue(record.risk_plan_zero_count), "zero-size risk plans", "warn")
      ].join("");

      document.getElementById("lifecycleBars").innerHTML = barRows(record.lifecycle_distribution);
      document.getElementById("evPanel").innerHTML = detailList({
        status: ev.status || "UNKNOWN",
        ev_value_events: countValue(ev.value_events),
        ev_null_events: countValue(ev.null_events),
        null_reason_coverage_rate: ev.null_reason_coverage_rate,
        top_null_reasons: Object.entries(ev.top_null_reasons || {}).map(([k, v]) => `${k}: ${v}`).join(", ") || "none",
        evidence_only: ev.does_not_claim_ev_available ? "true" : "false"
      });
      document.getElementById("liquidityPanel").innerHTML = detailList({
        status: liquidity.status || "UNKNOWN",
        readiness_status: liquidity.readiness_status || "UNKNOWN",
        orderbook_unavailable_count: countValue(liquidity.orderbook_unavailable_count),
        empty_book_count: countValue(liquidity.empty_book_count),
        stale_book_count: countValue(liquidity.stale_book_count),
        spread_normalization_rate: liquidity.spread_normalization_rate,
        liquidity_states: Object.entries(liquidity.liquidity_states || {}).map(([k, v]) => `${k}: ${v}`).join(", ") || "none",
        bad_json_warning: badJson.warning ? `${badJson.status}; selected ${badJson.selected_run_bad_lines}; scanned ${badJson.total_scanned_bad_lines}` : "none for selected run"
      });
      document.getElementById("timelineCards").innerHTML = (record.timeline_cards || []).map((card) => (
        `<article class="timeline-card"><h3>${card.title}</h3>${detailList(card.items)}</article>`
      )).join("");
    }

    function renderTable(records) {
      if (!records.length) {
        document.getElementById("recordsTable").innerHTML = '<div class="empty">No records match the current filters.</div>';
        return;
      }
      document.getElementById("recordsTable").innerHTML = `<table>
        <thead><tr>
          <th>Run ID</th><th>Date</th><th>Continuity</th><th>Root Cause</th><th>Blocks</th><th>Reports</th>
        </tr></thead>
        <tbody>${records.map((record) => `<tr>
          <td>${record.run_id}</td>
          <td>${record.date}</td>
          <td><span class="pill ${statusClass(record.continuity.status)}">${record.continuity.status}</span></td>
          <td>${record.root_cause.primary || "UNKNOWN"}<br><span class="small">${record.root_cause.secondary || ""}</span></td>
          <td>time_unsafe ${countValue(record.time_unsafe_count)}<br>risk_plan_zero ${countValue(record.risk_plan_zero_count)}</td>
          <td>${(record.source_files || []).join("<br>")}</td>
        </tr>`).join("")}</tbody>
      </table>`;
    }

    function rerender() {
      const records = filteredRecords();
      const selected = selectDefault(records);
      renderSelected(selected);
      renderTable(records);
    }

    async function loadReports() {
      const response = await fetch("/api/reports", { cache: "no-store" });
      state.payload = await response.json();
      state.records = state.payload.records || [];
      document.getElementById("guardrail").textContent = state.payload.guardrail;
      renderFilters();
      rerender();
    }

    for (const id of ["runFilter", "dateFilter", "searchFilter"]) {
      document.addEventListener("input", (event) => {
        if (event.target && event.target.id === id) rerender();
      });
      document.addEventListener("change", (event) => {
        if (event.target && event.target.id === id) rerender();
      });
    }
    loadReports().catch((error) => {
      document.getElementById("guardrail").textContent = `Failed to load local reports: ${error}`;
    });
  </script>
</body>
</html>
